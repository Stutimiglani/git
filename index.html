<!DOCTYPE html>

<head>
    <title>Working of Git</title>
</head>

<body>

    <h1>Working of Git</h1>

    <h2>1. Change Folder into Repository</h2>
    <p>Command: git init</p>

    <h2>2. Add Untracked Files to Staging</h2>
    <p>Command: git add filename</p>

    <h2>3. Save Tracked Files to Local Repository</h2>
    <p>Command: git commit -m "message"</p>

    <h2>4. Save from Local to Remote Repository</h2>
    <p>Command: git push</p>

</body>
</html>
